<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenEye — AI Camera Monitor</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <span class="logo">OpenEye</span>
      <div class="status-badge" id="statusBadge">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusLabel">Idle</span>
      </div>
    </div>
  </header>

  <div class="source-toolbar">
    <label class="mode-option">
      <input type="radio" name="feedMode" id="modeLive" value="live" checked />
      Live Camera
    </label>
    <label class="mode-option">
      <input type="radio" name="feedMode" id="modeDemo" value="demo" />
      Demo Video
    </label>
  </div>

  <main class="layout">
    <!-- ── left: camera feed ── -->
    <section class="panel-camera">
      <div class="camera-toolbar">
        <label class="mode-option">
          <input type="radio" name="drawMode" value="rect" checked />
          Rectangle
        </label>
        <label class="mode-option">
          <input type="radio" name="drawMode" value="poly" />
          Polygon
        </label>
        <label class="mode-option">
          <input type="radio" name="drawMode" value="circle" />
          Circle
        </label>
        <button class="btn-sm" id="drawZoneBtn" onclick="toggleDrawMode()">Draw Zone</button>
        <span class="toolbar-hint" id="drawHint"></span>
      </div>

      <div class="camera-frame">
        <img id="cameraFeed" src="/video_feed" alt="Live camera feed" />
        <canvas id="zoneCanvas"></canvas>
        <div class="camera-overlay" id="cameraOverlay">
          <span>Camera unavailable</span>
        </div>
      </div>

      <div class="zone-name-prompt" id="zoneNamePrompt">
        <div class="prompt-inner">
          <div class="prompt-label">Name this zone</div>
          <div class="prompt-row">
            <input
              type="text"
              class="zone-name-input"
              id="zoneNameInput"
              placeholder="e.g. Yellow Zone"
              spellcheck="false"
            />
            <button class="btn-confirm" onclick="confirmZoneName()">Save</button>
            <button class="btn-cancel-sm" onclick="hidePendingPrompt()">Cancel</button>
          </div>
        </div>
      </div>

      <!-- rule input (live camera mode) -->
      <div class="card rule-card" id="liveRuleCard">
        <div class="rule-library-toggle-row">
          <button class="btn-sm" id="liveLibraryBtn" onclick="toggleRuleLibrary('live')">Rule Library</button>
        </div>
        <div class="rule-library-panel" id="liveLibraryPanel" style="display:none;"></div>

        <label class="rule-label" for="ruleInput">Monitoring Rule</label>
        <p class="rule-hint">Use the Rule Library above, or type your own rule below.</p>
        <textarea
          id="ruleInput"
          class="rule-input"
          rows="3"
          placeholder="Alert me if someone enters the yellow zone"
          spellcheck="false"
        ></textarea>
        <div class="rule-actions">
          <button class="btn btn-start" id="startBtn" onclick="startMonitoring()">
            Start Monitoring
          </button>
          <button class="btn btn-stop" id="stopBtn" onclick="stopMonitoring()" disabled>
            Stop
          </button>
        </div>
      </div>

      <!-- demo video panel (demo mode) -->
      <div class="card demo-panel" id="demoPanel" style="display:none;">
        <!-- stage 1 + 2: rule entry + source selection -->
        <div class="demo-stage" id="demoSetup">
          <div class="rule-library-toggle-row">
            <button class="btn-sm" id="demoLibraryBtn" onclick="toggleRuleLibrary('demo')">Rule Library</button>
          </div>
          <div class="rule-library-panel" id="demoLibraryPanel" style="display:none;"></div>

          <label class="rule-label" for="demoRuleInput">Monitoring Rule</label>
          <p class="rule-hint">Use the Rule Library above, or type your own rule below.</p>
          <textarea
            id="demoRuleInput"
            class="rule-input"
            rows="3"
            placeholder="Alert me if someone enters the yellow zone"
            spellcheck="false"
          ></textarea>

          <div class="demo-source-row">
            <button class="btn-sm" id="useSampleBtn" disabled onclick="useSampleVideo()">Use sample video</button>
            <button class="btn-sm" id="uploadVideoBtn" disabled onclick="triggerDemoUpload()">Upload video</button>
            <button class="btn-sm btn-draw-active" id="rerunSameBtn" style="display:none;" onclick="startDemoRun()">Analyse loaded video</button>
            <input
              type="file"
              id="demoVideoInput"
              accept=".mp4,.mov,.avi,video/mp4,video/quicktime,video/x-msvideo"
              style="display:none;"
              onchange="onDemoVideoChosen()"
            />
          </div>
          <span class="toolbar-hint" id="demoSetupHint"></span>
        </div>

        <!-- stage 3: analysis run -->
        <div class="demo-stage" id="demoRun" style="display:none;">
          <p class="demo-progress" id="demoProgress">Analysing frame 0 of 0</p>
          <button class="btn-sm btn-danger" onclick="cancelDemoRun()">Cancel</button>
        </div>

        <!-- stage 4: results -->
        <div class="demo-stage" id="demoResults" style="display:none;">
          <p class="demo-summary" id="demoSummary"></p>
          <div class="demo-result-actions">
            <button class="btn-sm" onclick="tryAnotherRule()">Try another rule</button>
            <button class="btn-sm" onclick="newVideo()">New video</button>
          </div>
        </div>
      </div>

      <!-- alert feed -->
      <div class="card alerts-card">
        <div class="alerts-header">
          <h2 class="section-title">Alerts</h2>
          <span class="alert-count" id="alertCount">0</span>
        </div>
        <div class="alerts-list" id="alertsList">
          <div class="empty-state" id="emptyState">
            <p>No alerts yet.</p>
            <p class="empty-hint">Alerts will appear here when your rule is triggered.</p>
          </div>
        </div>
      </div>
    </section>

    <!-- ── right: zones ── -->
    <aside class="panel-side">
      <!-- zones -->
      <div class="card zones-card">
        <div class="zones-header">
          <h2 class="section-title">Zones</h2>
          <button class="btn-sm" onclick="clearAllZones()">Clear All</button>
        </div>
        <div class="zones-list" id="zonesList">
          <p class="zones-empty" id="zonesEmpty">No zones defined yet.</p>
        </div>
      </div>
    </aside>
  </main>

  <script src="/static/main.js"></script>
</body>
</html>
