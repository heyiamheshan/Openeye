<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenEye — AI Camera Monitor</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <span class="logo">OpenEye</span>
        <span class="status-badge" id="statusBadge">
          <span class="status-dot" id="statusDot"></span>
          <span class="status-label" id="statusLabel">Idle</span>
        </span>
      </div>
    </div>
  </header>

  <main class="layout">
    <!-- ── left column: feed + controls + zone chips ── -->
    <section class="feed-col">

      <!-- camera / demo feed -->
      <div class="camera-frame" id="cameraFrame">
        <img id="cameraFeed" src="/video_feed" alt="Live camera feed" />
        <video id="demoVideo" muted autoplay playsinline hidden></video>
        <img id="frozenFrame" class="frozen-frame" alt="" hidden />
        <canvas id="zoneCanvas"></canvas>
        <div class="camera-overlay" id="cameraOverlay">
          <span>Camera unavailable</span>
        </div>

        <!-- zone-drawing toolbar: overlaid on the feed, visible only while drawing -->
        <div class="draw-toolbar" id="drawToolbar" hidden>
          <div class="shape-picker" id="shapePicker">
            <label class="shape-option">
              <input type="radio" name="drawMode" id="modeRect" value="rect" checked />
              <span>Rectangle</span>
            </label>
            <label class="shape-option">
              <input type="radio" name="drawMode" id="modePoly" value="poly" />
              <span>Polygon</span>
            </label>
            <label class="shape-option">
              <input type="radio" name="drawMode" id="modeCircle" value="circle" />
              <span>Circle</span>
            </label>
          </div>
          <span class="toolbar-hint" id="drawHint"></span>
          <button type="button" class="btn-ghost btn-sm-w" id="cancelDrawBtn" onclick="cancelDraw()">Cancel</button>
        </div>
      </div>

      <!-- control bar: mode toggle · actions -->
      <div class="control-bar">
        <div class="mode-toggle" id="feedModeToggle">
          <button type="button" class="mode-btn active" data-mode="live">Live</button>
          <button type="button" class="mode-btn" data-mode="demo">Demo</button>
        </div>

        <div class="control-actions">
          <button type="button" class="btn-ghost" id="drawZoneBtn" onclick="toggleDrawMode()">
            Draw zone
          </button>
          <button type="button" class="btn-primary" id="startBtn"
                  data-tip="Add at least one enabled rule to start monitoring"
                  onclick="startMonitoring()">
            Start monitoring
          </button>
          <button type="button" class="btn-neutral" id="stopBtn" onclick="stopMonitoring()" hidden>
            Stop
          </button>
        </div>
      </div>

      <!-- demo sources + progress (demo mode only) -->
      <div class="demo-strip" id="demoStrip" hidden>
        <div class="demo-sources" id="demoSources"></div>
        <div class="demo-progress"><div class="demo-progress-fill" id="demoProgress"></div></div>
        <span class="demo-status" id="demoStatusText"></span>
        <input type="file" id="demoVideoInput" hidden
               accept=".mp4,.mov,.avi,video/mp4,video/quicktime,video/x-msvideo" />
      </div>

      <!-- zone chips -->
      <div class="zone-chips" id="zonesList"></div>

      <!-- zone-name prompt, shown while naming a drawn zone -->
      <div class="zone-name-prompt" id="zoneNamePrompt">
        <div class="prompt-inner">
          <p class="prompt-label">Name this zone</p>
          <div class="prompt-row">
            <input
              id="zoneNameInput"
              class="zone-name-input"
              type="text"
              placeholder="e.g. entrance, shelf A, doorway"
              maxlength="40"
              autocomplete="off"
            />
            <button type="button" class="btn-dark btn-sm-w" onclick="confirmZoneName()">Save</button>
            <button type="button" class="btn-ghost btn-sm-w" onclick="hidePendingPrompt()">Cancel</button>
          </div>
        </div>
      </div>

    </section>

    <!-- ── right column: rules + alerts ── -->
    <aside class="side-col">

      <!-- rules card -->
      <div class="card rules-card">
        <h2 class="card-title">Rules</h2>

        <div class="rule-composer">
          <input
            id="ruleInput"
            type="text"
            placeholder="Describe what to watch for…"
            maxlength="200"
            autocomplete="off"
            spellcheck="false"
          />
          <input
            id="proximitySubjectInput"
            class="proximity-input"
            type="text"
            title="Subject"
            placeholder="a person"
            maxlength="80"
            autocomplete="off"
            spellcheck="false"
            hidden
          />
          <input
            id="proximityHazardInput"
            class="proximity-input"
            type="text"
            title="Near"
            placeholder="a forklift"
            maxlength="80"
            autocomplete="off"
            spellcheck="false"
            hidden
          />
          <select id="ruleTypeSelect" title="Rule type">
            <option value="standard" selected>Standard</option>
            <option value="ppe_check">PPE check</option>
            <option value="proximity">Proximity</option>
          </select>
          <select id="zoneSelect" title="Restrict rule to a zone">
            <option value="">Whole frame</option>
          </select>
          <button type="button" class="btn-primary btn-sm-w" id="addRuleBtn">Add</button>
        </div>

        <div class="ppe-checklist" id="ppeChecklist" hidden>
          <label class="ppe-option"><input type="checkbox" value="helmet" /> Helmet</label>
          <label class="ppe-option"><input type="checkbox" value="high-visibility vest" /> High-visibility vest</label>
          <label class="ppe-option"><input type="checkbox" value="safety gloves" /> Safety gloves</label>
          <label class="ppe-option"><input type="checkbox" value="protective eyewear" /> Protective eyewear</label>
          <label class="ppe-option"><input type="checkbox" value="face mask" /> Face mask</label>
          <label class="ppe-option"><input type="checkbox" value="safety boots" /> Safety boots</label>
        </div>

        <div class="rule-library-wrap">
          <button type="button" class="library-link" id="ruleLibraryLink">Browse rule library</button>
          <div class="rule-library" id="ruleLibrary" hidden></div>
        </div>

        <div class="rules-list" id="rulesList"></div>
      </div>

      <!-- alerts card -->
      <div class="card alerts-card">
        <div class="alerts-header">
          <h2 class="card-title">Alerts</h2>
          <span class="alert-count" id="alertCount">0</span>
        </div>
        <div class="alerts-list" id="alertsList">
          <p class="empty-state" id="emptyState">No alerts yet</p>
        </div>
      </div>

    </aside>
  </main>

  <!-- hidden canvas that renders demo scenes, streamed into #demoVideo -->
  <canvas id="demoSceneCanvas" width="1280" height="720" hidden></canvas>

  <!-- alert image lightbox -->
  <div class="lightbox-backdrop" id="lightboxBackdrop" hidden>
    <div class="lightbox-card">
      <img id="lightboxImg" class="lightbox-img" alt="Alert frame" />
      <p class="lightbox-explanation" id="lightboxExplanation"></p>
      <div class="ppe-checklist-large" id="lightboxPpeChecklist" hidden></div>
      <p class="lightbox-meta" id="lightboxMeta"></p>
      <div class="lightbox-actions">
        <button type="button" class="btn-rose" id="lightboxDownloadBtn">Download</button>
        <button type="button" class="btn-ghost" id="lightboxCloseBtn">Close</button>
      </div>
    </div>
  </div>

  <script src="/static/main.js"></script>
</body>
</html>
